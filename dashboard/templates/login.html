<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureBox Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">SB</div>
    <p class="eyebrow">SECUREBOX</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to monitor your storage box.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
    <p class="login-help">Default development login: <strong>admin / securebox</strong></p>
  </main>
</body>
</html>
